<!-- Navbar الموحد -->
<div class="navbar">
    <h2 class="logo">Tec Store</h2>

        <li><a href="index.html">Home</a></li>
        <li>Shop</li>
        <!-- أيقونة العربة والقائمة المنسدلة -->
        <li class="cart-wrapper">
            <div id="cart-icon" onclick="toggleCart()">
                🛒 <span id="cart-count">0</span>
            </div>
            <div id="cart-dropdown" class="cart-dropdown">
                <ul id="cart-items-list">
                    <li style="text-align:center; padding:10px;">العربة فارغة</li>
                </ul>
                <div class="cart-total">
                    <p>Total: $<span id="cart-total-price">0</span></p>
                    <button class="checkout-btn">Checkout</button>
                </div>
            </div>
        </li>
    </ul>
</div>

                <button onclick="changeQty(this, -1, 'HP Laptop')">-</button>
